[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "picoagent"
version = "0.1.0"
description = "Reproducible tiny tool-agent training and inference"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=5.10,<6", "accelerate>=1.15,<2", "httpx[socks]>=0.28,<1"]
qlora = ["peft>=0.19,<1", "bitsandbytes>=0.49,<1"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.11,<1"]
colab = ["google-colab-cli==0.7.4"]

[project.scripts]
picoagent-train = "picoagent.training.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/picoagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
